<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de fotos de Saint Denis</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1 id="titulo">Galeria de fotos de Saint Denis</h1>
        <p class="subtitulo">Conheça os lugares da cidade</p>
    </header>

    <main>
        <nav>
            <a href="index.html">Início</a>
        </nav>

        <section>
            <h2>Fotos da cidade</h2>
            <div class="galeria">

                <div class="cartao">
                    <img src="imagens/vista.png" alt="Vista da cidade">
                    <h3>Vista da cidade</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/trem.png" alt="Estação de trem">
                    <h3>Estação de trem</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/teatro.png" alt="Teatro">
                    <h3>Teatro</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/porto.png" alt="Porto">
                    <h3>Porto</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/igreja.png" alt="Igreja">
                    <h3>Igreja</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/centro.png" alt="Centro da cidade">
                    <h3>Centro da cidade</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/cemiterio.png" alt="Cemiterio">
                    <h3>Cemiterio</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/arquitetura.png" alt="Arquitetura">
                    <h3>Arquitetura</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/casas.png" alt="Casas da cidade">
                    <h3>Casas da cidade</h3>
                </div>

                <div class="cartao">
                    <img src="imagens/paisagem.png" alt="Paisagem">
                    <h3>Paisagem</h3>
                </div>
            </div>
        </section>

        <a href="index.html">
            <button>Voltar para o início</button>
        </a>
    </main>
</body>
</html>
